<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Retail IQ Indian Store Data architecture</title>
  <desc id="desc">One Indian Store Data CSV flows through governed raw, curated, marts, and machine learning layers to FastAPI, Next.js dashboards, and read-only Power BI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071326"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#be185d"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#ca8a04"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity=".45"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0l10 5.5L0 11z" fill="#60a5fa"/></marker>
    <style>
      .h1{font:700 35px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.sub{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
      .lane{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#93c5fd;letter-spacing:2px}.nt{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .copy{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}.small{font:600 12px Inter,Segoe UI,Arial,sans-serif;fill:#dbeafe}
      .flow{fill:none;stroke:#60a5fa;stroke-width:3;marker-end:url(#arrow)}.soft{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <circle cx="1280" cy="0" r="280" fill="#2563eb" opacity=".09"/><circle cx="70" cy="810" r="230" fill="#7c3aed" opacity=".09"/>
  <g transform="translate(58 48)"><rect width="48" height="48" rx="13" fill="url(#blue)"/><text x="13" y="34" font-family="Inter,Arial" font-size="27" font-weight="800" fill="white">R</text><text x="66" y="29" class="h1">Retail IQ Architecture</text><text x="66" y="56" class="sub">Indian Store Data → governed intelligence → confident decisions</text></g>

  <text x="58" y="154" class="lane">01 · SOURCE &amp; ETL</text><text x="330" y="154" class="lane">02 · GOVERNED DATA</text><text x="812" y="154" class="lane">03 · INTELLIGENCE</text><text x="1110" y="154" class="lane">04 · DELIVERY</text>

  <g filter="url(#shadow)">
    <rect x="58" y="188" width="220" height="142" rx="18" fill="#13233e" stroke="#334155"/><rect x="58" y="188" width="8" height="142" rx="4" fill="#22d3ee"/>
    <text x="86" y="228" class="nt">Indian Store Data</text><text x="86" y="260" class="copy">indian_store_data.csv</text><text x="86" y="285" class="copy">100,000 flat transaction rows</text><text x="86" y="310" class="copy">2019–2023 · INR</text>
    <rect x="58" y="386" width="220" height="150" rx="18" fill="#13233e" stroke="#7c3aed"/><rect x="58" y="386" width="8" height="150" rx="4" fill="#8b5cf6"/>
    <text x="86" y="426" class="nt">Idempotent Pipeline</text><text x="86" y="458" class="copy">Ingest + normalize</text><text x="86" y="483" class="copy">Quality reports + outlier flags</text><text x="86" y="508" class="copy">Alembic-managed schemas</text>
  </g>
  <path class="flow" d="M168 330v46"/><path class="flow" d="M278 461h42"/>

  <g filter="url(#shadow)">
    <rect x="326" y="188" width="430" height="436" rx="22" fill="#0f2038" stroke="#0891b2" stroke-width="2"/><rect x="326" y="188" width="430" height="58" rx="22" fill="url(#blue)"/><path d="M326 222h430v24H326z" fill="url(#blue)"/><text x="354" y="225" class="nt">PostgreSQL 15 · Four governed schemas</text>
    <rect x="354" y="276" width="170" height="108" rx="14" fill="#123047" stroke="#22d3ee"/><text x="376" y="310" class="nt">raw</text><text x="376" y="339" class="copy">store_transactions</text><text x="376" y="362" class="copy">source-shaped audit layer</text>
    <rect x="552" y="276" width="176" height="108" rx="14" fill="#123047" stroke="#14b8a6"/><text x="574" y="310" class="nt">curated</text><text x="574" y="339" class="copy">customers · products · orders</text><text x="574" y="362" class="copy">trusted geography + auth</text>
    <rect x="354" y="416" width="170" height="108" rx="14" fill="#123047" stroke="#38bdf8"/><text x="376" y="450" class="nt">marts</text><text x="376" y="479" class="copy">8 pre-aggregated tables</text><text x="376" y="502" class="copy">filter-safe grains</text>
    <rect x="552" y="416" width="176" height="108" rx="14" fill="#123047" stroke="#c084fc"/><text x="574" y="450" class="nt">ml</text><text x="574" y="479" class="copy">model registry + metrics</text><text x="574" y="502" class="copy">Gradient Boosting · id 4</text>
    <path class="soft" d="M524 330h22"/><path class="soft" d="M640 389v21"/><path class="soft" d="M552 470h-22"/>
    <rect x="354" y="557" width="374" height="40" rx="11" fill="#0c4a6e"/><text x="376" y="582" class="small">✓ one metric dictionary   ✓ lineage   ✓ least privilege</text>
  </g>
  <path class="flow" d="M756 312h46"/><path class="flow" d="M756 494h46"/>

  <g filter="url(#shadow)">
    <rect x="808" y="188" width="250" height="190" rx="18" fill="#211a3c" stroke="#8b5cf6"/><rect x="808" y="188" width="250" height="8" rx="4" fill="url(#violet)"/><text x="836" y="234" class="nt">Analytics Engine</text><text x="836" y="268" class="copy">EDA + broad screening</text><text x="836" y="294" class="copy">Chi-Square · ANOVA · T-Test</text><text x="836" y="320" class="copy">Segments · geography · profit</text><rect x="836" y="337" width="188" height="25" rx="12" fill="#4c1d95"/><text x="853" y="354" class="small">Business intelligence first</text>
    <rect x="808" y="424" width="250" height="200" rx="18" fill="#211a3c" stroke="#db2777"/><rect x="808" y="424" width="250" height="8" rx="4" fill="url(#violet)"/><text x="836" y="470" class="nt">ML Pipeline</text><text x="836" y="504" class="copy">10 leakage-safe features</text><text x="836" y="530" class="copy">5-model fair comparison</text><text x="836" y="556" class="copy">High-Profit Order prediction</text><rect x="836" y="581" width="184" height="25" rx="12" fill="#831843"/><text x="852" y="598" class="small">Confidence + explanations</text>
  </g>
  <path class="flow" d="M1058 282h42"/><path class="flow" d="M1058 524h42"/>

  <g filter="url(#shadow)">
    <rect x="1106" y="188" width="236" height="132" rx="18" fill="#102a49" stroke="#3b82f6"/><text x="1134" y="230" class="nt">FastAPI</text><text x="1134" y="261" class="copy">JWT · validation · OpenAPI</text><text x="1134" y="286" class="copy">Analytics + model inference</text>
    <rect x="1106" y="370" width="236" height="112" rx="18" fill="#102a49" stroke="#38bdf8"/><text x="1134" y="412" class="nt">Next.js 14</text><text x="1134" y="443" class="copy">Live responsive dashboards</text><text x="1134" y="467" class="copy">Leaflet · Recharts · en-IN</text>
    <rect x="1106" y="532" width="236" height="112" rx="18" fill="#2b2307" stroke="#facc15"/><text x="1134" y="574" class="nt">Power BI</text><text x="1134" y="605" class="copy">Governed DAX + mart model</text><text x="1134" y="629" class="copy">SELECT-only marts access</text>
  </g>
  <path class="flow" d="M1224 320v40"/><path class="soft" d="M1106 588h-34v77H438V530"/>

  <g transform="translate(58 690)"><rect width="1284" height="82" rx="18" fill="#0f1c32" stroke="#334155"/><text x="26" y="32" class="lane">PRODUCTION-GRADE CONTROLS</text><text x="26" y="59" class="small">🔐 JWT + hashed refresh tokens</text><text x="274" y="59" class="small">🧪 unit · integration · e2e</text><text x="520" y="59" class="small">📊 Power BI parity</text><text x="710" y="59" class="small">🗺 geographic choropleth</text><text x="944" y="59" class="small">🐳 Docker Compose</text><text x="1130" y="59" class="small">✓ CI</text></g>
</svg>
