[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-bi-backend"
version = "0.1.0"
description = "FastAPI backend for the Retail IQ platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.110,<1",
    "kaggle>=1.6,<2",
    "ipykernel>=6.29,<7",
    "matplotlib>=3.9,<4",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "pandas>=2.2,<3",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "scipy>=1.14,<2",
    "seaborn>=0.13,<1",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/analytics/generate_reports.py" = ["E501"]
"app/etl/build_marts.py" = ["E501"]
"app/etl/clean.py" = ["E501"]
"app/etl/quality.py" = ["E501"]
"app/services/customer_analytics_service.py" = ["E501"]
"app/services/eda_service.py" = ["E501"]
"app/services/stats_service.py" = ["E501"]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["asyncpg", "kaggle.*", "matplotlib.*", "nbclient", "nbclient.*", "nbformat", "nbformat.*", "pandas.*", "scipy.*", "seaborn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.analytics.generate_reports"]
disallow_untyped_calls = false
